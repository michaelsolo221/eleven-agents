name: Agents CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configs
        run: python3 scripts/validate-configs.py

  pr-test:
    name: Test PR branch
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Push to PR branch
        run: |
          for config in $(jq -r '.agents[].config' agents.json); do
            agent_name=$(jq -r '.name' "$config")
            echo "Pushing $agent_name to pr-${{ github.event.pull_request.number }}..."
            elevenlabs agents push --agent "$agent_name" --branch "pr-${{ github.event.pull_request.number }}"
          done

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py --branch-name "pr-${{ github.event.pull_request.number }}"

      - name: Run tests
        run: python3 scripts/test-pr-branch.py --branch-name "pr-${{ github.event.pull_request.number }}"

  push:
    name: Push agents
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Push agents
        run: elevenlabs agents push

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py

  test:
    name: Run agent tests
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Run tests
        run: bash scripts/run-tests.sh
