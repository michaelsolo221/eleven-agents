name: Agents CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configs
        run: python3 scripts/validate-configs.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check and test server (ruff, mypy, pytest)
        run: |
          cd server
          uv sync --frozen
          uv run ruff check .
          uv run mypy .
          uv run pytest

      - name: Build and smoke-test the Docker image
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            docker logs webhook-smoke
            exit 1
          }
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t webhook-smoke-test ./server
          docker run -d --name webhook-smoke \
            -p 8000:8000 \
            -e ELEVENLABS_WEBHOOK_SECRET=ci-smoke-test-secret \
            -e RESEND_API_KEY=re_ci_dummy \
            -e NOTIFICATION_EMAIL=ci@example.com \
            webhook-smoke-test
          healthy=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "container healthy"; healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            fail "/health never became healthy"
          fi
          reported_sha=$(curl -sf http://localhost:8000/version | jq -r '.git_sha')
          if [ "$reported_sha" != "$GITHUB_SHA" ]; then
            fail "/version reported git_sha=$reported_sha, expected $GITHUB_SHA"
          fi
          echo "/version correctly reports $reported_sha"

      - name: Clean up smoke-test container
        if: always()
        run: docker rm -f webhook-smoke 2>/dev/null || true

  pr-test:
    name: Test PR branch
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-elevenlabs-cli
        with:
          api-key: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Create PR branches
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for agent_id in $(jq -r '.agents[].id' agents.json); do
            branch_name="pr-${PR_NUMBER}"
            version_id=$(jq -r --arg id "$agent_id" '.agents[] | select(.id == $id) | .version_id' agents.json)
            echo "Ensuring branch $branch_name for agent $agent_id..."
            http_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "https://api.elevenlabs.io/v1/convai/agents/$agent_id/branches" \
              -H "xi-api-key: $ELEVENLABS_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"parent_version_id\": \"$version_id\", \"name\": \"$branch_name\", \"description\": \"PR #${PR_NUMBER} test branch\"}")
            if [ "$http_code" = "200" ] || [ "$http_code" = "400" ] || [ "$http_code" = "422" ]; then
              echo "  Branch $branch_name ready (HTTP $http_code)"
            else
              echo "::error::Failed to create branch $branch_name (HTTP $http_code)"
              exit 1
            fi
          done

      - name: Push to PR branch
        run: |
          set -euo pipefail
          for agent_id in $(jq -r '.agents[].id' agents.json); do
            echo "Pushing $agent_id to pr-${{ github.event.pull_request.number }}..."
            elevenlabs agents push --agent "$agent_id" --branch "pr-${{ github.event.pull_request.number }}"
          done

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py --branch-name "pr-${{ github.event.pull_request.number }}"

      # Tests are flaky (see #31). Report results but don't block merge
      # until #31's LLM-evaluator divergence is resolved.
      - name: Run tests
        continue-on-error: true
        run: python3 scripts/test-pr-branch.py --branch-name "pr-${{ github.event.pull_request.number }}"

  push:
    name: Push agents
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-elevenlabs-cli
        with:
          api-key: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Push agents
        run: elevenlabs agents push

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py

  test:
    name: Run agent tests
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-elevenlabs-cli
        with:
          api-key: ${{ secrets.ELEVENLABS_API_KEY }}

      # Tests are flaky (see #31). Report results but don't block main CI
      # until #31's LLM-evaluator divergence is resolved.
      - name: Run tests
        continue-on-error: true
        run: bash scripts/run-tests.sh
