name: Agents CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configs
        run: python3 scripts/validate-configs.py

  pr-test:
    name: Test PR branch
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Create PR branches
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for entry in $(jq -c '.agents[]' agents.json); do
            agent_id=$(echo "$entry" | jq -r '.id')
            branch_name="pr-${PR_NUMBER}"
            echo "Creating branch $branch_name for agent $agent_id..."
            http_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "https://api.elevenlabs.io/v1/convai/agents/$agent_id/branches" \
              -H "xi-api-key: $ELEVENLABS_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"parent_version_id\": \"$(echo "$entry" | jq -r '.version_id')\", \"name\": \"$branch_name\", \"description\": \"PR #${PR_NUMBER} test branch\"}")
            if [ "$http_code" = "200" ] || [ "$http_code" = "422" ]; then
              echo "  Branch $branch_name ready (HTTP $http_code)"
            else
              echo "::error::Failed to create branch $branch_name (HTTP $http_code)"
              exit 1
            fi
          done

      - name: Push to PR branch
        run: |
          for agent_id in $(jq -r '.agents[].id' agents.json); do
            echo "Pushing $agent_id to pr-${{ github.event.pull_request.number }}..."
            elevenlabs agents push --agent "$agent_id" --branch "pr-${{ github.event.pull_request.number }}"
          done

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py --branch-name "pr-${{ github.event.pull_request.number }}"

      - name: Run tests
        run: python3 scripts/test-pr-branch.py --branch-name "pr-${{ github.event.pull_request.number }}"

  push:
    name: Push agents
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Push agents
        run: elevenlabs agents push

      - name: Verify live tools match config
        run: python3 scripts/verify-live-tools.py

  test:
    name: Run agent tests
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ElevenLabs CLI
        run: npm install -g @elevenlabs/cli

      - name: Authenticate
        run: echo "$ELEVENLABS_API_KEY" | elevenlabs auth login

      - name: Run tests
        run: bash scripts/run-tests.sh
