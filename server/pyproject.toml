[project]
name = "eleven-agents-server"
version = "0.1.0"
description = "ElevenLabs post-call webhook receiver and HMAC verification"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "jinja2>=3.1.0",
    "resend>=2.6.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
